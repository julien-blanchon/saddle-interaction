[workspace]
members = [
    "common",
    "basic",
    "hold",
    "multi_action",
    "chained",
    "gated",
    "accessibility",
    "prompt_ui",
    "vehicle_bay",
    "dialogue_terminal",
    "lab",
]
resolver = "3"

[workspace.dependencies]
bevy = "0.18"
bevy_flair = "0.7"
bevy_enhanced_input = "0.24"
bevy_input_focus = "0.18"
bevy_ui_widgets = "0.18"
saddle-interaction = { path = ".." }
saddle-animation-text-animation = { git = "https://github.com/julien-blanchon/saddle-animation-text-animation" }
saddle-animation-tween = { git = "https://github.com/julien-blanchon/saddle-animation-tween" }
saddle-pane = { git = "https://github.com/julien-blanchon/saddle-pane" }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
collapsible_if = "allow"
