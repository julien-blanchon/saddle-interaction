[workspace]
members = [
    "common",
    "basic",
    "hold",
    "multi_slot",
    "sequence",
    "gated",
    "vehicle",
    "aim_focus",
    "lab",
    "fps_interactive",
    "pickup_prompt",
    "vehicle_entry",
]
resolver = "3"

[workspace.dependencies]
bevy = "0.18"
bevy_flair = "0.7"
bevy_enhanced_input = "0.24"
bevy_input_focus = "0.18"
bevy_ui_widgets = "0.18"
saddle-interaction = { path = ".." }
saddle-pane = { git = "https://github.com/julien-blanchon/saddle-pane" }
# Cross-crate Tier 1 deps
saddle-character-controller = { git = "https://github.com/julien-blanchon/saddle-character-controller" }
saddle-physics-object-interaction = { git = "https://github.com/julien-blanchon/saddle-physics-object-interaction" }
saddle-vehicle-ground-vehicle = { git = "https://github.com/julien-blanchon/saddle-vehicle-ground-vehicle" }
avian3d = "0.6"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
collapsible_if = "allow"
