[workspace]
members = [
    "common",
    "basic",
    "hold",
    "multi_action",
    "chained",
    "gated",
    "accessibility",
    "prompt_ui",
    "lab",
]
resolver = "3"

[workspace.dependencies]
bevy = "0.18"
bevy_enhanced_input = "0.24"
saddle-interaction = { path = ".." }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
